name: default

on:
  push:
  pull_request:
permissions:
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.7.1/ktlint && chmod a+x ktlint && sudo mv ktlint /usr/local/bin/
      - name: run ktlint
        run: |
          ktlint --reporter=checkstyle,output=build/ktlint-report.xml
        continue-on-error: true
      - uses: yutailang0119/action-ktlint@v3
        with:
          report-path: build/*.xml # Support glob patterns by https://www.npmjs.com/package/@actions/glob
        continue-on-error: false # If annotations contain error of severity, action-ktlint exit 1.
  unit-test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties' )}}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Replace android.jar
        run: |
          curl -L https://github.com/Reginer/aosp-android-jar/raw/main/android-36/android.jar > /usr/local/lib/android/sdk/platforms/android-36/android.jar
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
  build-release-apk:
    needs: [lint, unit-test]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-apk.yml
    with:
      build-type: release
    secrets:
      key-alias: ${{ secrets.KEY_ALIAS }}
      keystore: ${{ secrets.KEYSTORE_B64 }}
      key-password: ${{ secrets.KEY_PASSWORD }}
  build-app-bundle:
    needs: [lint, unit-test]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-aab.yml
    secrets:
      key-alias: ${{ secrets.KEY_ALIAS }}
      keystore: ${{ secrets.KEYSTORE_B64 }}
      key-password: ${{ secrets.KEY_PASSWORD }}
  release:
    needs: [build-release-apk, build-app-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        id: download-apk
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build-release-apk.outputs.filename }}
      - name: Download App Bundle
        id: download-bundle
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build-app-bundle.outputs.filename }}
      - name: Release to GitHub
        uses: softprops/action-gh-release@v1
        with:
          name: "v${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dev.bluehouse.enablevolte.apk
            dev.bluehouse.enablevolte.aab
