name: default

on:
  push:
    paths:
      - "app/src/**"
  pull_request:
    paths:
      - "app/src/**"
permissions:
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.7.1/ktlint && chmod a+x ktlint && sudo mv ktlint /usr/local/bin/
      - name: run ktlint
        run: |
          ktlint --reporter=checkstyle,output=build/ktlint-report.xml
        continue-on-error: true
      - uses: yutailang0119/action-ktlint@v3
        with:
          report-path: build/*.xml # Support glob patterns by https://www.npmjs.com/package/@actions/glob
        continue-on-error: false # If annotations contain error of severity, action-ktlint exit 1.
  unit-test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties' )}}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the removed 'tools' package, which makes sdkmanager exit 1.
          packages: platform-tools
      - name: Install required platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Replace android.jar
        run: |
          curl -L https://github.com/Reginer/aosp-android-jar/raw/main/android-36/android.jar > /usr/local/lib/android/sdk/platforms/android-36/android.jar
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
  build-debug-apk:
    needs: [lint, unit-test]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build-apk.yml
    with:
      build-type: debug
    secrets:
      key-alias: ${{ secrets.DEBUG_KEY_ALIAS }}
      keystore: ${{ secrets.DEBUG_KEYSTORE_B64 }}
      key-password: ${{ secrets.DEBUG_KEY_PASSWORD }}
  post-apk-link:
    needs: [build-debug-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Post link to action run detail page
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const commentResult = await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `APK build completed! Visit [action run detail page](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) to download the APK to test this pull request.`
              })
              console.log(commentResult)
            } catch (e) {
              console.log("Comment not posted:")
              console.log(e)
            }
